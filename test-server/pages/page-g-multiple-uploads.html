<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Multiple Document Uploads</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f0f0f0; }
    h2 { color: #333; }
    .upload-box { background: #fff; padding: 15px; margin-bottom: 20px; border-radius: 8px; border: 1px solid #ccc; max-width: 500px; }
    .upload-box label { display: block; font-weight: bold; margin-bottom: 10px; }
    .upload-box input[type="file"] { margin-bottom: 15px; }
    button { padding: 8px 16px; background: #007bff; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #0056b3; }
  </style>
</head>
<body>

  <h2>Multi-Document Upload Testing</h2>
  <p>This page tests the agent's ability to selectively resolve semantic document names to the correct file inputs.</p>

  <div class="upload-box">
    <label for="upload-aadhaar">1. Upload Aadhaar Card (Image or PDF)</label>
    <input type="file" id="upload-aadhaar" accept="image/*,.pdf">
  </div>

  <div class="upload-box">
    <label for="upload-pan">2. Upload PAN Card (Image or PDF)</label>
    <input type="file" id="upload-pan" accept="image/*,.pdf">
  </div>

  <div class="upload-box">
    <label for="upload-invoice">3. Upload General Document (PDF Invoice)</label>
    <input type="file" id="upload-invoice" accept=".pdf">
  </div>
  
  <div class="upload-box">
    <button onclick="alert('Files submitted successfully!')">Submit Documents</button>
  </div>

</body>
</html>
