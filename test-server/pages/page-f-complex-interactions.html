<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Complex Interactions Test</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f0f0f0; }
    h2 { color: #333; }
    .section { background: #fff; padding: 15px; margin-bottom: 20px; border-radius: 8px; border: 1px solid #ccc; }
    
    /* Kanban Drag and Drop */
    .kanban { display: flex; gap: 20px; }
    .column { background: #e2e8f0; padding: 10px; width: 200px; border-radius: 6px; min-height: 150px; }
    .column h3 { margin-top: 0; font-size: 14px; }
    .task { background: white; padding: 10px; margin-bottom: 8px; border-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); cursor: grab; }
    
    /* Right Click */
    .context-area { width: 200px; height: 100px; background: #cbd5e1; display: flex; align-items: center; justify-content: center; border: 2px dashed #64748b; cursor: context-menu; }
    #custom-menu { display: none; position: absolute; background: white; border: 1px solid #ccc; box-shadow: 0 2px 5px rgba(0,0,0,0.2); padding: 5px 0; z-index: 1000; }
    #custom-menu div { padding: 8px 15px; cursor: pointer; }
    #custom-menu div:hover { background: #f1f5f9; }
    
    /* Iframe */
    iframe { border: 2px solid #ccc; border-radius: 8px; width: 100%; height: 200px; }
  </style>
</head>
<body>

  <h2>Complex Agent Interactions</h2>
  
  <div class="section">
    <h3>1. Drag & Drop (Kanban)</h3>
    <div class="kanban">
      <div class="column" id="todo" ondragover="event.preventDefault()" ondrop="drop(event, this)">
        <h3>To Do</h3>
        <div id="task1" class="task" draggable="true" ondragstart="drag(event)">Write Tests</div>
        <div id="task2" class="task" draggable="true" ondragstart="drag(event)">Fix Bugs</div>
      </div>
      <div class="column" id="done" ondragover="event.preventDefault()" ondrop="drop(event, this)">
        <h3>Done</h3>
      </div>
    </div>
    <script>
      function drag(ev) { ev.dataTransfer.setData("text", ev.target.id); }
      function drop(ev, el) { 
        ev.preventDefault(); 
        var data = ev.dataTransfer.getData("text"); 
        el.appendChild(document.getElementById(data)); 
      }
    </script>
  </div>

  <div class="section">
    <h3>2. Right Click (Context Menu)</h3>
    <div class="context-area" id="rc-target">Right Click Me</div>
    <div id="custom-menu">
      <div onclick="alert('Action 1 executed!')">Action 1</div>
      <div onclick="alert('Action 2 executed!')">Action 2</div>
    </div>
    <script>
      const rcTarget = document.getElementById('rc-target');
      const menu = document.getElementById('custom-menu');
      rcTarget.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        menu.style.display = 'block';
        menu.style.left = e.pageX + 'px';
        menu.style.top = e.pageY + 'px';
      });
      document.addEventListener('click', () => { menu.style.display = 'none'; });
    </script>
  </div>

  <div class="section">
    <h3>3. Native Dialogs</h3>
    <button onclick="alert('This is a test alert!')">Show Alert</button>
    <button onclick="confirm('Are you sure?')">Show Confirm</button>
    <button onclick="prompt('Enter your name:', 'Agent')">Show Prompt</button>
  </div>

  <div class="section">
    <h3>4. Iframe Interactions</h3>
    <iframe id="stripe-frame" srcdoc='
      <!DOCTYPE html>
      <html>
      <head><style>body { font-family: sans-serif; padding: 10px; background: #fff; }</style></head>
      <body>
        <h4>Payment Details</h4>
        <input type="text" id="cc-number" placeholder="Card Number 4242 4242">
        <button onclick="alert(`Card Saved: ` + document.getElementById(`cc-number`).value)">Save</button>
      </body>
      </html>
    '></iframe>
  </div>

  <div class="section">
    <h3>5. File Downloads</h3>
    <!-- A data URL representing "Total Due: $500\nThank you for your business." -->
    <a href="data:text/plain;charset=utf-8,Total%20Due%3A%20%24500%0AThank%20you%20for%20your%20business." download="invoice.txt">Download Invoice.txt</a>
  </div>

</body>
</html>
