<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page A — Normal Contact Form (non-sensitive)</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f6f9; color: #17202e; padding: 40px 16px; max-width: 560px; margin: 0 auto; }
    h1 { font-size: 22px; } p.sub { color: #4c5a72; }
    form { background: #fff; border: 1px solid #dde3ec; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    label { font-size: 13px; font-weight: 600; }
    input, select { font-size: 14px; padding: 8px 10px; border: 1px solid #c4cddb; border-radius: 8px; width: 100%; box-sizing: border-box; }
    button { background: #2f5bd7; color: #fff; border: none; border-radius: 8px; padding: 10px; font-size: 14px; font-weight: 600; cursor: pointer; }
    #done-a { display: none; background: #e3f4e9; border: 1px solid #157a3d; border-radius: 8px; padding: 12px; margin-top: 12px; }
  </style>
</head>
<body>
  <h1>Newsletter Signup</h1>
  <p class="sub">Page A — normal non-sensitive form. No identity numbers requested.</p>
  <form id="normal-form">
    <div><label for="f_name">Full name</label><input type="text" id="f_name" name="name" placeholder="Jane Doe" autocomplete="name"></div>
    <div><label for="f_email">Email address</label><input type="email" id="f_email" name="email" placeholder="jane@example.com" autocomplete="email"></div>
    <div><label for="f_phone">Phone number</label><input type="tel" id="f_phone" name="phone" placeholder="9876543210" autocomplete="tel"></div>
    <div><label for="f_address">Street address</label><input type="text" id="f_address" name="address" placeholder="Flat 4, MG Road" autocomplete="street-address"></div>
    <div><label for="f_country">Country</label>
      <select id="f_country" name="country" autocomplete="country-name">
        <option value="">Choose…</option><option value="IN">India</option><option value="US">United States</option><option value="UK">United Kingdom</option>
      </select>
    </div>
    <button type="submit" id="normal_submit">Submit</button>
  </form>
  <div id="done-a">Thanks — signed up!</div>
  <script>
    document.getElementById('normal-form').addEventListener('submit', function (e) {
      e.preventDefault(); document.getElementById('done-a').style.display = 'block';
    });
  </script>
</body>
</html>
