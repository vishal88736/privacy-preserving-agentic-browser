name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  extension:
    runs-on: ubuntu-latest
    # A test that never settles (unresolved promise) blocks the runner until
    # this cap fires, so cap it well below the 360 minute job limit.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:all
      - run: npm run build:extensions

  backend-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m unittest discover -s tests/security -p 'test_*.py'
